# Keeps the hosted app awake so it answers instantly, whenever someone opens it. Set the repository variable
# APP_URL to the app's address (e.g. https://dino1x-causal-verdict-cre.hf.space).
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health route
        run: curl -fsS --retry 4 --retry-delay 15 --max-time 60 "${{ vars.APP_URL }}/api/agent/x402-info" -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
