# Publishes the workstation as a static site in replay mode: bundled real RYO snapshots, the real feed capture
# and the latest committed ledger. Live RYO calls, feeds, x402 and the Claude analyst need the server (render.yaml).
name: pages
on:
  push:
    branches: [main]
  # Commits made by the hourly agent use GITHUB_TOKEN, which does not trigger push workflows.
  workflow_run:
    workflows: [agent]
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vite build --base=./
      - name: Publish the witness files (head files, Bitcoin proofs, Sigstore bundles) next to the site
        run: cp -r witness dist/
      - run: node scripts/check-secrets.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
