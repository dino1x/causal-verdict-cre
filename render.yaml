# One-click deploy of the full app (UI + /api proxy + feeds + x402 gateway) on Render.
# Secrets are set in the Render dashboard (sync: false) and stay server-side.
services:
  - type: web
    name: causal-verdict-cre
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/agent/x402-info
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RYO_MCP_URL
        value: https://app-ryochan.com/api/mcp
      - key: RYO_MCP_KEY
        sync: false
      # Optional: Claude analyst debate and Tavily news. Leave empty to run without them.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # x402: settle each demo payment on Base Sepolia. The demo agent wallet is testnet-only and funded with test USDC.
      - key: X402_SETTLE
        value: "1"
      - key: X402_PAY_TO
        value: "0x451988253D2c8476BefF48a5f1920b38BA5256B1"
      - key: X402_DEMO_PAYER_KEY
        sync: false
